on:
  push:
    branches: [main]
    paths: ['srcpkgs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-linux:latest-full-x86_64
      options: --privileged
      volumes:
        - /dev:/dev
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup dependencies
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -Syu nodejs bash sudo git xz tar rclone

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: pithos-void-packages

      - name: Download repository from R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          mkdir repository
          rclone copy "r2:$R2_BUCKET" repository

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Create builder user
        run: |
          useradd -m -G xbuilder builder
          chown -R builder:builder .

      - name: Bootstrap xbps-src
        run: |
          sudo -u builder bash -lc '
            cd void-packages
            echo XBPS_CHROOT_CMD=uchroot >> etc/conf
            ./xbps-src binary-bootstrap
            echo "repository=https://void.pithos.day" >> ./etc/xbps.d/repos-remote.conf
          '

      - name: Copy srcpkgs
        run: |
          cd pithos-void-packages
          bash copy.sh "$GITHUB_WORKSPACE/void-packages"

      - name: Detect and build new packages
        id: build
        run: |
          TO_BUILD=()

          for template in pithos-void-packages/srcpkgs/*/template; do
            pkgname=$(basename "$(dirname "$template")")

            # 再配布できないもの (restricted=yes) は配布しない
            if grep -q '^restricted=yes' "$template"; then
              echo "- Skipped: $pkgname"
              continue
            fi

            version=$(grep '^version=' "$template" | cut -d= -f2)
            revision=$(grep '^revision=' "$template" | cut -d= -f2)

            if ! compgen -G "repository/${pkgname}-${version}_${revision}*.xbps" \
                 2>/dev/null | grep -q .; then
              echo "→ Build needed: $pkgname-${version}_${revision}"
              TO_BUILD+=("$pkgname")
            else
              echo "✓ Already built: $pkgname-${version}_${revision}"
            fi
          done

          if [[ ${#TO_BUILD[@]} -eq 0 ]]; then
            echo "Nothing to build."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${{ vars.ENCODED_REPOSITORY_SIGN_PUBLIC_KEY }}" | base64 -d  > ./void-packages/masterdir-x86_64/var/db/xbps/keys/${{ vars.FINGERPRINT }}.plist

          # パッケージごとのビルド時間を、ランの Summary に表として出す
          {
            echo "| パッケージ | 結果 | ビルド時間 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in "${TO_BUILD[@]}"; do
            echo "::group::Build $pkg"
            start=$SECONDS
            status=0
            sudo -u builder bash -lc '
              cd void-packages
              ./xbps-src pkg '$pkg'
            ' || status=$?
            elapsed=$((SECONDS - start))
            echo "::endgroup::"

            result=$([[ $status -eq 0 ]] && echo "成功" || echo "失敗")
            printf '| `%s` | %s | %dm %02ds |\n' "$pkg" "$result" $((elapsed / 60)) $((elapsed % 60)) \
              | tee -a "$GITHUB_STEP_SUMMARY"
            [[ $status -eq 0 ]] || exit "$status"
          done

          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Update repository
        run: |
          find void-packages/hostdir/binpkgs -maxdepth 1 -name '*.xbps' -exec cp {} repository/ \;
          cd repository

          # template がなくなった、または配布対象から外れたパッケージを消す
          for pkg in ./*.xbps; do
            [[ -e "$pkg" ]] || continue
            pkgname=$(basename "${pkg%-*}")
            template="../pithos-void-packages/srcpkgs/$pkgname/template"
            if [[ ! -f "$template" ]] || grep -q '^restricted=yes' "$template"; then
              echo "- Removed: $(basename "$pkg")"
              rm -f "$pkg"
            fi
          done

          # インデックスは毎回作り直す。既存のインデックスに追加すると、共有ライブラリの
          # 構成が変わった更新が staged 扱いになり、新しいバージョンが公開されないことがある
          rm -f ./*-repodata ./*-stagedata
          xbps-rindex -a ./*.xbps
          # 古いバージョンのパッケージを消す
          xbps-rindex -r "$PWD"
          for sig in ./*.sig2; do
            [[ -e "${sig%.sig2}" ]] || rm -f "$sig"
          done

      - name: Sign repository
        run: |
          cd repository
          printf '%s\n' "${{ secrets.REPOSITORY_SIGN_KEY }}" > private.pem
          chmod 600 private.pem
          xbps-rindex --sign --signedby "${{ vars.REPOSITORY_SIGN_NAME }}" --privkey private.pem "$PWD"
          xbps-rindex --sign-pkg --signedby "${{ vars.REPOSITORY_SIGN_NAME }}" --privkey private.pem ./*.xbps
          rm -f private.pem

      - name: Upload repository to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          rclone sync repository "r2:$R2_BUCKET"
